<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7B2FF7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Efesios" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Ruleta de Efesios</title>
    <style>
      :root {
        --fondo1: #7b2ff7;
        --fondo2: #f72f9a;
        --fondo3: #ff8a3d;
        --potencia: #ffd93d;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Nunito",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        min-height: 100vh;
        color: #fff;
        background: linear-gradient(
          135deg,
          var(--fondo1),
          var(--fondo2) 50%,
          var(--fondo3)
        );
        background-attachment: fixed;
        display: flex;
        justify-content: center;
        padding: 28px 16px 110px;
        overflow-x: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .bg-shapes .shape {
        position: fixed;
        opacity: 0.25;
        font-size: 2rem;
        animation: flotar 6s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
      }
      .s1 {
        top: 8%;
        left: 8%;
      }
      .s2 {
        top: 15%;
        right: 10%;
        font-size: 2.6rem;
        animation-delay: 1s;
      }
      .s3 {
        bottom: 20%;
        left: 6%;
        animation-delay: 2s;
      }
      .s4 {
        bottom: 12%;
        right: 8%;
        animation-delay: 0.5s;
      }
      @keyframes flotar {
        0%,
        100% {
          transform: translateY(0) rotate(0);
        }
        50% {
          transform: translateY(-18px) rotate(15deg);
        }
      }
      .container {
        width: 100%;
        max-width: 560px;
        text-align: center;
        position: relative;
        z-index: 1;
      }
      .header h1 {
        font-family: "Fredoka", "Nunito", system-ui, sans-serif;
        font-size: clamp(2rem, 7vw, 3rem);
        text-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
      }
      .subtitle {
        margin-top: 6px;
        font-weight: 700;
        opacity: 0.95;
        font-size: 1rem;
      }
      .wheel-section {
        margin-top: 24px;
      }
      .wheel-wrap {
        position: relative;
        width: min(86vw, 360px);
        margin: 0 auto;
        touch-action: none;
        cursor: pointer;
      }
      .pointer {
        position: absolute;
        top: -16px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 2.4rem;
        color: #fff;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
        z-index: 4;
        pointer-events: none;
      }
      .power-ring {
        position: absolute;
        inset: -14px;
        width: calc(100% + 28px);
        height: calc(100% + 28px);
        transform: rotate(-90deg);
        z-index: 3;
        pointer-events: none;
      }
      .power-bg {
        fill: none;
        stroke: rgba(255, 255, 255, 0.3);
        stroke-width: 6;
      }
      .power-arc {
        fill: none;
        stroke: var(--potencia);
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 301.6;
        stroke-dashoffset: 301.6;
      }
      .wheel-wrap.cargando .wheel-cross {
        animation: latir 0.4s ease-in-out infinite alternate;
      }
      @keyframes latir {
        from {
          transform: translate(-50%, -50%) scale(1);
        }
        to {
          transform: translate(-50%, -50%) scale(1.15);
        }
      }
      #ruleta {
        width: 100%;
        height: auto;
        border-radius: 50%;
        border: 8px solid #fff;
        box-shadow:
          0 12px 30px rgba(0, 0, 0, 0.35),
          0 0 0 8px rgba(255, 255, 255, 0.25);
        cursor: pointer;
        background: #fff;
        display: block;
        position: relative;
        z-index: 2;
      }
      #ruleta.girando {
        cursor: wait;
      }
      .wheel-wrap.cargando #ruleta {
        transform: scale(0.97);
      }
      .wheel-cross {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 76px;
        height: 76px;
        border-radius: 50%;
        border: 5px solid #fff;
        background: #2d2a55;
        color: #ffd93d;
        font-size: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
        z-index: 2;
        pointer-events: none;
      }
      .resultado {
        position: relative;
        margin-top: 60px;
        background: #fff;
        color: #2d2a55;
        border-radius: 24px;
        padding: 34px 22px 26px;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.3);
        animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        margin-bottom: 60px;
      }
      .btn-cerrar {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3px solid #2d2a55;
        background: #2d2a55;
        color: #fff;
        font-size: 1.3rem;
        font-weight: 800;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        transition: transform 0.12s ease;
      }
      .btn-cerrar:hover {
        transform: scale(1.1);
      }
      .resultado.oculto {
        display: none;
      }
      @keyframes pop {
        from {
          transform: scale(0.7);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .res-categoria {
        display: inline-block;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 2px;
        background: linear-gradient(90deg, var(--fondo1), var(--fondo2));
        color: #fff;
        padding: 5px 16px;
        border-radius: 999px;
        margin-bottom: 12px;
      }
      .res-texto {
        font-size: 1.15rem;
        font-weight: 600;
        line-height: 1.55;
        font-style: italic;
      }
      .res-cita {
        margin-top: 12px;
        font-weight: 700;
        color: var(--fondo2);
        font-size: 1.05rem;
      }
      .progreso {
        margin-top: 14px;
        font-size: 0.9rem;
        font-weight: 800;
        color: #6b678f;
      }
      .btn-reset {
        margin-top: 10px;
        background: transparent;
        color: #6b678f;
        border: 2px solid #d9d6ef;
        border-radius: 999px;
        padding: 7px 20px;
        font-weight: 800;
        font-size: 0.85rem;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          background 0.12s ease;
      }
      .btn-reset:hover {
        transform: scale(1.04);
        background: #f1efff;
      }
      .btn-panel {
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.85);
        font-weight: 700;
        font-size: 0.8rem;
        cursor: pointer;
        opacity: 0.7;
        pointer-events: auto;
      }
      .btn-panel:hover {
        opacity: 1;
        text-decoration: underline;
      }
      .footer-fijo {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.35));
        pointer-events: none;
      }
      .footer-fijo .panel {
        pointer-events: auto;
        margin: 0;
        width: min(92vw, 420px);
        max-height: 40vh;
        overflow-y: auto;
      }
      .panel {
        margin: 10px auto 0;
        max-width: 560px;
        background: rgba(255, 255, 255, 0.16);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 16px;
        padding: 14px 18px 16px;
      }
      .panel.oculto {
        display: none;
      }
      .panel .progreso {
        margin-top: 0;
        color: #fff;
      }
      .panel .btn-reset {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.6);
      }
      .panel .btn-reset:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .final-emoji {
        font-size: 3rem;
      }
      .final-titulo {
        font-size: 1.4rem;
        font-weight: 800;
        margin: 10px 0 6px;
      }
      .final-sub {
        font-weight: 600;
        color: #6b678f;
        line-height: 1.5;
      }
      .btn-reset-grande {
        margin-top: 18px;
        background: #2d2a55;
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 12px 34px;
        font-weight: 800;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.12s ease;
      }
      .btn-reset-grande:hover {
        transform: scale(1.05);
      }
      .confeti span {
        position: fixed;
        top: -20px;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        z-index: 99;
        animation: caer linear forwards;
        pointer-events: none;
      }
      @keyframes caer {
        to {
          transform: translateY(110vh) rotate(720deg);
          opacity: 0.8;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-shapes" aria-hidden="true">
      <span class="shape s1">✦</span>
      <span class="shape s2">✿</span>
      <span class="shape s3">♥</span>
      <span class="shape s4">✦</span>
    </div>

    <main class="container">
      <header class="header">
        <h1 id="titulo">Ruleta de Efesios</h1>
        <p id="subtitulo" class="subtitle"></p>
      </header>

      <section class="wheel-section">
        <div class="wheel-wrap" id="wheelWrap">
          <div class="pointer" aria-hidden="true">▼</div>
          <svg class="power-ring" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="power-bg" cx="50" cy="50" r="48" />
            <circle id="powerArc" class="power-arc" cx="50" cy="50" r="48" />
          </svg>
          <canvas
            id="ruleta"
            width="520"
            height="520"
            role="img"
            aria-label="Mantén pulsada la ruleta para cargar fuerza y suelta para girar"
          ></canvas>
          <div class="wheel-cross" aria-hidden="true">✝</div>
        </div>
      </section>

      <section id="resultado" class="resultado oculto" aria-live="polite">
        <button id="btnCerrar" class="btn-cerrar" type="button" aria-label="Cerrar pregunta">✕</button>
        <p id="resCategoria" class="res-categoria"></p>
        <blockquote id="resTexto" class="res-texto"></blockquote>
        <p id="resCita" class="res-cita"></p>
      </section>

      <section id="final" class="resultado oculto" aria-live="polite">
        <div class="final-emoji" aria-hidden="true">🎉</div>
        <p id="finalCategoria" class="res-categoria">COMPLETADO</p>
        <p class="final-titulo">¡Felicidades, has hecho todas!</p>
        <p id="finalSub" class="final-sub">
          Has visto las 57 preguntas de Efesios.
        </p>
        <button id="btnResetFinal" class="btn-reset-grande" type="button">
          ↺ Empezar de cero
        </button>
      </section>
    </main>

    <footer class="footer-fijo">
      <div id="panelProgreso" class="panel oculto" aria-live="polite">
        <p id="progreso" class="progreso"></p>
        <button id="btnReset" class="btn-reset" type="button">
          ↺ empezar de cero
        </button>
      </div>
      <button
        id="btnPanel"
        class="btn-panel"
        type="button"
        aria-expanded="false"
        aria-controls="panelProgreso"
      >
        ··· ver progreso
      </button>
    </footer>

    <div id="confeti" class="confeti" aria-hidden="true"></div>

    <script>
      /* ============================================================
         ⚙️ AJUSTES — EDITA AQUÍ. Es el antiguo config.json,
         ahora dentro del propio index.html para que el doble-clic
         funcione sin errores de file:// ni servidor.
         ============================================================ */
      const CONFIG = {
        titulo: "Ruleta de Efesios",
        subtitulo: "Mantén pulsada la ruleta para cargar fuerza... ¡y suelta!",
        duracionSegundos: 5,
        vueltasMinimas: 5,
        vueltasMaximas: 8,
        tiempoCargaMaxMs: 1500,
        fuerzaMinima: 0.2,
        colorPotencia: "#FFD93D",
        coloresRuleta: [
          "#FF595E",
          "#FFCA3A",
          "#8AC926",
          "#1982C4",
          "#6A4C93",
          "#FF924C",
          "#00C2A8",
          "#FF5D8F",
        ],
        etiquetasRuleta: [
          "GRACIA",
          "FE",
          "LUZ",
          "AMOR",
          "PAZ",
          "UNIDAD",
          "FUERZA",
          "ESPERANZA",
        ],
        fondoDegradado: ["#7B2FF7", "#F72F9A", "#FF8A3D"],
        mostrarConfeti: true,
        mostrarSonido: true,
        textos: [
          {
            cita: "Efesios 1:4",
            texto:
              "1) Vs. 4 – “Dios nos escogió antes de la creación del mundo”. De acuerdo a esta frase de Pablo, Dios considera más importante a la humanidad entera que a un solo individuo. ¿Estás de acuerdo? ¿Por qué?",
            categoria: "EFESIOS 1",
          },
          {
            cita: "Efesios 1:7",
            texto:
              "2) Redimir significa: conseguir la libertad de una persona esclava, mediante el pago de un precio. Vs. 7 – Pablo afirma que el máximo Creador redimió a los seres humanos por medio de Jesucristo. ¿Tú consideras que eres o fuiste un esclavo? ¿De qué o de quién?",
            categoria: "EFESIOS 1",
          },
          {
            cita: "Efesios 1:7",
            texto:
              "3) Pecado significa: pensamiento, palabra o acción considerada en contra de la voluntad de Dios. Vs. 7 – ¿De qué maneras puedo enterarme de cuál es la voluntad de Dios?",
            categoria: "EFESIOS 1",
          },
          {
            cita: "Efesios 1:10",
            texto:
              "4) Vs. 10 – Pablo afirma que Dios realiza sus asuntos cuando el tiempo estimado se ha cumplido. ¿Te consideras una persona paciente? Cuéntanos alguna anécdota personal donde veamos dicha cualidad.",
            categoria: "EFESIOS 1",
          },
          {
            cita: "Efesios 1:13",
            texto:
              "5) El evangelio son esas buenas noticias que explican la transacción que Dios hizo con la sangre de su Hijo Jesucristo para redimirnos. Vs. 13 – Pablo afirma que estas buenas noticias nos trajeron salvación. ¿Por qué crees que Jesucristo quiso salvarnos?",
            categoria: "EFESIOS 1",
          },
          {
            cita: "Efesios 1:17",
            texto:
              "6) Vs. 17 – Pablo pide en sus oraciones al Dios de Jesucristo que nos dé espíritu de sabiduría y revelación para que lo conozcamos mejor. ¿Por qué Pablo quiere que conozcamos mejor al Creador?",
            categoria: "EFESIOS 1",
          },
          {
            cita: "Efesios 1:18",
            texto:
              "7) Vs. 18 – Pablo pide que se nos abran los ojos del entendimiento. ¿El “sentido común” será igual al “entendimiento que proviene de Dios”? Cuéntanos alguna anécdota donde tu “sentido común” te ha llevado allí donde habías planificado llegar. O viceversa.",
            categoria: "EFESIOS 1",
          },
          {
            cita: "Efesios 1:19",
            texto:
              "8) Vs. 19 – Pablo afirma que es incomparable el poder de Dios que está a favor de los que creemos. ¿De qué manera has experimentado el poder de Dios en tu vida?",
            categoria: "EFESIOS 1",
          },
          {
            cita: "Efesios 1:22",
            texto:
              "9) Vs. 22 – Pablo dice que Dios sometió todas las cosas al dominio de Cristo y que lo puso como cabeza de todo en la iglesia. ¿Crees que la iglesia es importante para Dios? ¿Por qué?",
            categoria: "EFESIOS 1",
          },
          {
            cita: "Efesios 2:1-2",
            texto:
              "10) Vs. 1 – Lee el versículo 1 y 2. Que yo sepa, yo jamás he estado muerto físicamente. ¿A qué se refiere Pablo cuando dice que en otro tiempo estábamos muertos?",
            categoria: "EFESIOS 2",
          },
          {
            cita: "Efesios 2:3",
            texto:
              "11) Vs. 3 – Pablo explica que antes seguíamos nuestra propia voluntad y que éramos impulsados por nuestros deseos pecaminosos. ¿Por qué Pablo mezcla estas dos frases? ¿Será que seguir mi propio criterio tiene alguna relación con deseos pecaminosos? Es decir, ¿según Pablo lo que yo deseo hacer naturalmente son deseos negativos? Comparte con nosotros si en tu pasado hubo alguna anécdota donde decidiste hacer lo que creías correcto y salió mal.",
            categoria: "EFESIOS 2",
          },
          {
            cita: "Efesios 2:4-5",
            texto:
              "12) Vs. 4 y 5 – Pablo explica que ahora estamos vivos gracias a Cristo y que Cristo surgió del amor y la misericordia que Dios tiene para con nosotros. El diccionario define la misericordia así: “sentir compasión por los que sufren y ofrecerles ayuda”. ¿Cuáles son tus sufrimientos en la actualidad? Compártelo con nosotros y cuando hayas terminado pide a alguien que lea en voz alta Juan 16:33.",
            categoria: "EFESIOS 2",
          },
          {
            cita: "Efesios 2:6",
            texto:
              "13) Vs. 6 – “Y en unión con Cristo Jesús, Dios nos resucitó y nos hizo sentar con él en las regiones celestiales”. Pienso que desde el cielo se puede ver todo con mayor claridad. Ahora que ya has conocido a Jesucristo, ¿qué cosas ves con claridad ahorita? Y si no, ¿qué cosas aún ves un poco borrosas? Comparte.",
            categoria: "EFESIOS 2",
          },
          {
            cita: "Efesios 2:7",
            texto:
              "14) Vs. 7 – En los seis versículos anteriores, Pablo ha estado explicando que antes estábamos perdidos y sufriendo, hasta que Jesús nos liberó. ¡Felicitaciones! Pero ahora en este versículo nos damos cuenta de que el propósito principal de Dios no era liberarnos, sino algo más trascendente. Y este versículo dice: “para mostrar en los tiempos venideros la incomparable riqueza de su gracia…”. Una persona con “gracia” es una persona que ejecuta favores inmerecidos. “Un regalo” podría ser un favor inmerecido. ¿Alguna vez le has regalado algo a alguien? ¿Cómo te sientes cuando le regalas algo a alguien a quien amas? Piensa cuando regalaste algo único. ¿Cómo te sentiste? Cuéntanos.",
            categoria: "EFESIOS 2",
          },
          {
            cita: "Efesios 2:10",
            texto:
              "15) Vs. 10 – “Porque somos hechura de Dios, creados en Cristo Jesús para buenas obras, las cuales Dios dispuso de antemano a fin de que las pongamos en práctica”. Pablo está convencido de que fuimos creados por Dios con el propósito de hacer buenas obras. Cuéntanos una o varias situaciones específicas que tú has visto en tu vida o en la vida de otros, las cuales tú consideras que son buenas obras.",
            categoria: "EFESIOS 2",
          },
          {
            cita: "Efesios 2:11-18",
            texto:
              "16) Vs. 11 al 18 – Sea cual sea tu creencia, tu historia o tu religión, al final todos tenemos una cosa en común, y es esa búsqueda de esperanza. Cristo decidió eliminar esa enemistad entre distintos bandos, al brindarnos esperanza a todos por igual. Si Cristo te acepta, entonces tú también puedes aceptar a otros. Cuéntanos alguna anécdota donde te sentiste rechazado o aceptado. ¿De qué manera podrías demostrar aceptación hacia otros?",
            categoria: "EFESIOS 2",
          },
          {
            cita: "Efesios 2:19",
            texto:
              "17) Vs. 19 – “Por lo tanto, ustedes ya no son extraños ni extranjeros, sino conciudadanos de los santos y miembros de la familia de Dios”. Pablo dice que ahora pertenecemos a la familia de Dios. Dentro de toda familia, sus miembros tienen responsabilidades. Cuéntanos cuáles son tus responsabilidades actuales dentro de tu familia sanguínea y cuando termines de nombrarlas, respondamos uno por uno: ¿cuáles serán nuestras responsabilidades dentro de la familia de Dios?",
            categoria: "EFESIOS 2",
          },
          {
            cita: "Efesios 2:20-21",
            texto:
              "18) Vs. 20 y 21 – “…Cristo Jesús mismo la piedra angular…”. En construcción, una piedra angular se define como esa primera piedra que determinará la estructura de las demás. También era la piedra que soportaba la mayor fuerza para sostener grandes muros y esquinas. Pablo trata de explicar que Jesús es nuestro mayor apoyo y el mayor ejemplo a imitar. ¿Pero cómo podemos imitar a alguien que desconocemos? ¿De qué manera podrías conocer a Jesús y su forma de actuar? Cuéntanos esas actitudes que conoces de Jesús y que intentas imitar.",
            categoria: "EFESIOS 2",
          },
          {
            cita: "Efesios 2:22",
            texto:
              "19) Vs. 22 – “En él (Cristo) también ustedes son edificados juntamente para ser morada de Dios por su Espíritu”. He aquí otro propósito para nosotros: ser morada, estancia, casa o residencia de Dios. Cuando Dios vive en ti, se demuestra con una perfecta paz. Cuando pasamos por muchos problemas es porque Dios está buscando tu atención. ¿Crees que Dios vive en ti o está buscando tu atención en la actualidad? ¿Por qué?",
            categoria: "EFESIOS 2",
          },
          {
            cita: "Efesios 3:1",
            texto:
              "20) Vs. 1 – “Por el bien de ustedes los gentiles, me arrodillo en oración”. Preocuparse significa enfocar tu atención en el problema. Ocuparse significa enfocar tus acciones en el problema. Pablo decide reemplazar su preocupación y sustituirla por oración. Compártenos alguna de tus preocupaciones actuales o del pasado.",
            categoria: "EFESIOS 3",
          },
          {

      (function () {
        const config = window.CONFIG || CONFIG;
        const canvas = document.getElementById("ruleta");
        const ctx = canvas.getContext("2d");
        const wrap = document.getElementById("wheelWrap");
        const powerArc = document.getElementById("powerArc");
        const resultado = document.getElementById("resultado");
        const finalSec = document.getElementById("final");
        const progreso = document.getElementById("progreso");
        const CIRC = 2 * Math.PI * 48;

        // ---- Vistos en localStorage (sin repetidos) ----
        const STORAGE_KEY = "efesios_vistos_v1";
        let vistos = cargarVistos();

        function cargarVistos() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return new Set();
            const arr = JSON.parse(raw);
            if (!Array.isArray(arr)) return new Set();
            return new Set(
              arr.filter(function (n) {
                return Number.isInteger(n);
              }),
            );
          } catch (_) {
            return new Set(); // file:// + modo privado: memoria de sesión
          }
        }

        function guardarVistos() {
          try {
            localStorage.setItem(
              STORAGE_KEY,
              JSON.stringify(Array.from(vistos)),
            );
          } catch (_) {}
        }

        function numDe(entry) {
          const m = /^\s*(\d+)\)/.exec(entry.texto || "");
          return m ? parseInt(m[1], 10) : -1;
        }

        function totalPreguntas() {
          return (config.textos || []).length;
        }

        function pendientes() {
          return (config.textos || []).filter(function (t) {
            return !vistos.has(numDe(t));
          });
        }

        function textoProgreso() {
          const total = totalPreguntas();
          const hechas = vistos.size;
          const faltan = Math.max(total - hechas, 0);
          return "Llevas " + hechas + " de " + total + " · te faltan " + faltan;
        }

        function mostrarFinal() {
          resultado.classList.add("oculto");
          finalSec.classList.remove("oculto");
          document.getElementById("finalSub").textContent =
            "Has visto las " + totalPreguntas() + " preguntas de Efesios.";
          try {
            finalSec.scrollIntoView({ block: "nearest" });
          } catch (_) {}
          if (config.mostrarConfeti) lanzarConfeti();
        }

        function resetear() {
          vistos = new Set();
          guardarVistos();
          finalSec.classList.add("oculto");
          resultado.classList.add("oculto");
          powerArc.style.strokeDashoffset = String(CIRC);
          progreso.textContent = textoProgreso();
          const panel = document.getElementById("panelProgreso");
          const btn = document.getElementById("btnPanel");
          if (panel && btn) {
            panel.classList.add("oculto");
            btn.setAttribute("aria-expanded", "false");
            btn.textContent = "··· ver progreso";
          }
        }

        let anguloActual = 0,
          girando = false,
          cargando = false;
        let cargaInicio = 0,
          cargaFrame = null;
        let audioCtx = null,
          cargaOsc = null,
          cargaGain = null;

        document.getElementById("titulo").textContent =
          config.titulo || "Ruleta de Efesios";
        document.getElementById("subtitulo").textContent =
          config.subtitulo || "";
        document.title = config.titulo || "Ruleta de Efesios";
        const f = config.fondoDegradado || ["#7B2FF7", "#F72F9A", "#FF8A3D"];
        document.documentElement.style.setProperty("--fondo1", f[0]);
        document.documentElement.style.setProperty("--fondo2", f[1]);
        document.documentElement.style.setProperty("--fondo3", f[2]);
        document.documentElement.style.setProperty(
          "--potencia",
          config.colorPotencia || "#FFD93D",
        );
        powerArc.style.strokeDasharray = String(CIRC);
        powerArc.style.strokeDashoffset = String(CIRC);

        dibujarRuleta(anguloActual);

        // Sin setPointerCapture: era lo que disparaba el error
        // "Unsafe attempt to load URL file://..." en algunos navegadores con file://.
        wrap.addEventListener("pointerdown", empezarCarga);
        window.addEventListener("pointerup", soltar);
        window.addEventListener("pointercancel", cancelarCarga);
        wrap.addEventListener("contextmenu", function (e) {
          e.preventDefault();
        });
        document
          .getElementById("btnReset")
          .addEventListener("click", function () {
            if (window.confirm("¿Empezar de cero? Se borrará tu progreso."))
              resetear();
          });
        document
          .getElementById("btnCerrar")
          .addEventListener("click", function () {
            resultado.classList.add("oculto");
          });
        document
          .getElementById("btnResetFinal")
          .addEventListener("click", function () {
            if (window.confirm("¿Empezar de cero? Se borrará tu progreso."))
              resetear();
          });
        document
          .getElementById("btnPanel")
          .addEventListener("click", function () {
            const panel = document.getElementById("panelProgreso");
            const btn = document.getElementById("btnPanel");
            const abierto = panel.classList.toggle("oculto") === false;
            btn.setAttribute("aria-expanded", abierto ? "true" : "false");
            btn.textContent = abierto ? "··· ocultar" : "··· ver progreso";
            if (abierto) progreso.textContent = textoProgreso();
          });
        // Clic en cualquier otro lugar oculta el panel si está desplegado
        document.addEventListener("pointerdown", function (e) {
          const panel = document.getElementById("panelProgreso");
          if (!panel || panel.classList.contains("oculto")) return;
          try {
            if (
              e.target &&
              e.target.closest &&
              e.target.closest("#panelProgreso, #btnPanel")
            )
              return;
          } catch (_) {}
          panel.classList.add("oculto");
          const btn = document.getElementById("btnPanel");
          if (btn) {
            btn.setAttribute("aria-expanded", "false");
            btn.textContent = "··· ver progreso";
          }
        });
        if (!pendientes().length && totalPreguntas() > 0) mostrarFinal();

        function dibujarRuleta(rotacion) {
          const etiquetas = config.etiquetasRuleta || [];
          const colores = config.coloresRuleta || ["#FF595E", "#FFCA3A"];
          const n = etiquetas.length || 1;
          const cx = canvas.width / 2,
            cy = canvas.height / 2;
          const radio = canvas.width / 2 - 6;
          const arco = (Math.PI * 2) / n;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < n; i++) {
            const inicio = rotacion + i * arco,
              fin = inicio + arco;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radio, inicio, fin);
            ctx.closePath();
            ctx.fillStyle = colores[i % colores.length];
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(inicio + arco / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff";
            ctx.font = "bold 26px system-ui, sans-serif";
            ctx.fillText(etiquetas[i] || "", radio - 22, 9);
            ctx.restore();
            ctx.beginPath();
            ctx.arc(
              cx + Math.cos(fin) * (radio - 8),
              cy + Math.sin(fin) * (radio - 8),
              6,
              0,
              Math.PI * 2,
            );
            ctx.fillStyle = "#fff";
            ctx.fill();
          }
        }

        function easeOutCubic(t) {
          return 1 - Math.pow(1 - t, 3);
        }

        function empezarCarga(e) {
          if (girando || cargando) return;
          // Tarjeta visible = lectura en curso: no se puede girar hasta cerrar la ✕
          if (!resultado.classList.contains("oculto")) return;
          if (!finalSec.classList.contains("oculto")) return;
          if (!pendientes().length) {
            mostrarFinal();
            return;
          }
          if (e) {
            try {
              e.preventDefault();
            } catch (_) {}
          }
          cargando = true;
          cargaInicio = performance.now();
          resultado.classList.add("oculto");
          finalSec.classList.add("oculto");
          wrap.classList.add("cargando");
          canvas.classList.add("girando");
          iniciarSonidoCarga();
          actualizarAnillo();
        }

        function fuerzaActual() {
          const max = config.tiempoCargaMaxMs || 1500;
          const p = Math.min((performance.now() - cargaInicio) / max, 1);
          const minF =
            config.fuerzaMinima !== undefined ? config.fuerzaMinima : 0.2;
          return { p: p, fuerza: minF + (1 - minF) * p };
        }

        function actualizarAnillo() {
          if (!cargando) return;
          const st = fuerzaActual();
          powerArc.style.strokeDashoffset = String(CIRC * (1 - st.p));
          cargaFrame = requestAnimationFrame(actualizarAnillo);
        }

        function cancelarCarga() {
          if (!cargando) return;
          cargando = false;
          if (cargaFrame) cancelAnimationFrame(cargaFrame);
          detenerSonidoCarga();
          wrap.classList.remove("cargando");
          canvas.classList.remove("girando");
          powerArc.style.strokeDashoffset = String(CIRC);
        }

        function soltar() {
          if (!cargando || girando) return;
          cargando = false;
          if (cargaFrame) cancelAnimationFrame(cargaFrame);
          detenerSonidoCarga();
          wrap.classList.remove("cargando");
          let st = fuerzaActual();
          let fuerza = st.fuerza;
          if (performance.now() - cargaInicio < 150) fuerza = 0.55; // clic corto = fuerza media
          powerArc.style.strokeDashoffset = String(CIRC);
          try {
            if (navigator.vibrate) navigator.vibrate(15);
          } catch (_) {}
          girarConFuerza(fuerza);
        }

        function girarConFuerza(fuerza) {
          girando = true;
          const base = (config.duracionSegundos || 5) * 1000;
          const duracion = base * (0.6 + fuerza * 0.6);
          const min =
            config.vueltasMinimas !== undefined ? config.vueltasMinimas : 5;
          const max =
            config.vueltasMaximas !== undefined ? config.vueltasMaximas : 8;
          const vueltas = min + fuerza * (max - min);
          const extra = Math.random() * Math.PI * 2;
          const inicial = anguloActual;
          const total = vueltas * Math.PI * 2 + extra;
          const t0 = performance.now();
          let ultimoTick = 0;
          function animar(ahora) {
            const t = Math.min((ahora - t0) / duracion, 1);
            const eased = easeOutCubic(t);
            anguloActual = inicial + total * eased;
            dibujarRuleta(anguloActual);
            if (ahora - ultimoTick > 120 + eased * 400) {
              tickSonido();
              ultimoTick = ahora;
            }
            if (t < 1) requestAnimationFrame(animar);
            else detener();
          }
          requestAnimationFrame(animar);
        }

        function detener() {
          girando = false;
          canvas.classList.remove("girando");
          const textos = config.textos || [];
          if (!textos.length) return;
          const restan = pendientes();
          if (!restan.length) {
            mostrarFinal();
            return;
          }
          const elegido = restan[Math.floor(Math.random() * restan.length)];
          vistos.add(numDe(elegido));
          guardarVistos();
          document.getElementById("resCategoria").textContent =
            "✦ " + (elegido.categoria || "").toUpperCase() + " ✦";
          document.getElementById("resTexto").textContent =
            '"' + elegido.texto + '"';
          document.getElementById("resCita").textContent = "— " + elegido.cita;
          progreso.textContent = textoProgreso();
          finalSec.classList.add("oculto");
          resultado.classList.remove("oculto");
          try {
            resultado.scrollIntoView({ block: "nearest" });
          } catch (_) {}
          if (config.mostrarConfeti) lanzarConfeti();
        }

        function ctxAudio() {
          if (!audioCtx)
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") {
            try {
              audioCtx.resume();
            } catch (_) {}
          }
          return audioCtx;
        }

        function tickSonido() {
          if (!config.mostrarSonido) return;
          try {
            const ac = ctxAudio();
            const osc = ac.createOscillator(),
              g = ac.createGain();
            osc.connect(g);
            g.connect(ac.destination);
            osc.type = "triangle";
            osc.frequency.value = 500 + Math.random() * 300;
            g.gain.setValueAtTime(0.08, ac.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.07);
            osc.start();
            osc.stop(ac.currentTime + 0.08);
          } catch (_) {}
        }

        function iniciarSonidoCarga() {
          if (!config.mostrarSonido) return;
          try {
            const ac = ctxAudio();
            cargaOsc = ac.createOscillator();
            cargaGain = ac.createGain();
            cargaOsc.connect(cargaGain);
            cargaGain.connect(ac.destination);
            cargaOsc.type = "sawtooth";
            cargaOsc.frequency.setValueAtTime(120, ac.currentTime);
            cargaOsc.frequency.linearRampToValueAtTime(
              520,
              ac.currentTime + (config.tiempoCargaMaxMs || 1500) / 1000,
            );
            cargaGain.gain.setValueAtTime(0.04, ac.currentTime);
            cargaOsc.start();
          } catch (_) {}
        }

        function detenerSonidoCarga() {
          try {
            if (cargaOsc) {
              try {
                cargaOsc.stop();
              } catch (_) {}
              try {
                cargaOsc.disconnect();
              } catch (_) {}
              try {
                cargaGain.disconnect();
              } catch (_) {}
              cargaOsc = null;
            }
          } catch (_) {}
        }

        function lanzarConfeti() {
          const cont = document.getElementById("confeti");
          cont.innerHTML = "";
          const colores = config.coloresRuleta || ["#FF595E", "#FFCA3A"];
          for (let i = 0; i < 80; i++) {
            const s = document.createElement("span");
            s.style.left = Math.random() * 100 + "vw";
            s.style.background = colores[i % colores.length];
            s.style.animationDuration = 2 + Math.random() * 2 + "s";
            s.style.width = 6 + Math.random() * 10 + "px";
            s.style.height = 8 + Math.random() * 10 + "px";
            s.style.animationDelay = Math.random() * 0.4 + "s";
            cont.appendChild(s);
            setTimeout(function () {
              try {
                s.remove();
              } catch (_) {}
            }, 4500);
          }
        }
      })();
    </script>
    <script>
      // Registro del Service Worker solo en http(s) — en file:// se omite sin errores.
      (function () {
        try {
          if (
            "serviceWorker" in navigator &&
            /^https?:$/.test(window.location.protocol)
          ) {
            window.addEventListener("load", function () {
              navigator.serviceWorker.register("sw.js").catch(function () {});
            });
          }
        } catch (_) {}
      })();
    </script>
  </body>
</html>
